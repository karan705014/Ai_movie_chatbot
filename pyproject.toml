[project]
name = "ai-movie-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Karan Singh", email = "aditya705014@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "curl-cffi>=0.16.3",
    "django>=6.1.1",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.1",
    "google-genai>=2.22.0",
    "langchain>=1.4.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "playwright>=1.62.0",
    "python-dotenv>=1.2.3",
    "selenium>=4.48.0",
    "wikipedia>=1.4.0",
]

[project.scripts]
ai-movie-chatbot = "ai_movie_chatbot:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
